services:
  - type: web
    name: nikai-matcha
    env: php
    plan: free
    buildCommand: ./build.sh
    startCommand: heroku-php-apache2 public/
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
